[project]
name = "pmosaic"
version = "0.1.0"
description = "A photomosaic creation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "pillow-heif>=0.10.0",
    "rawpy>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
